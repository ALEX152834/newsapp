version: "3.8"

services:
  # PostgreSQL 主数据库服务（应用使用）
  main_postgres:
    image: postgres:16
    container_name: news-postgres
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      news-network:
        # 主库在应用网络中使用别名 postgres
        aliases:
          - postgres

  # 测试数据库服务
  # 在测试网络中使用别名 postgres，确保测试时 host=postgres 指向测试库
  test_postgres:
    image: postgres:16
    container_name: news-test-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      news-network:
        # 测试库也在同一网络，但使用不同服务名
        aliases:
          - test_postgres
      test-network:
        # 在测试网络中，测试库使用别名 postgres
        aliases:
          - postgres

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: news-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - news-network
      - test-network

  # FastAPI 应用服务
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: news-api
    environment:
      # 应用连接主库（通过 postgres 别名）
      DATABASE_URL: postgresql://news:news@postgres:5432/news
      REDIS_URL: redis://redis:6379/0
      # 测试连接串使用 host=postgres，在 test-network 中指向测试库
      TEST_DATABASE_URL: postgresql://test:test@postgres:5432/test
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      main_postgres:
        condition: service_healthy
      test_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - news-network
      - test-network

volumes:
  postgres_data:

networks:
  # 应用网络：postgres 别名指向主库
  news-network:
    driver: bridge
  # 测试网络：postgres 别名指向测试库
  test-network:
    driver: bridge
