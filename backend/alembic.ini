# Alembic 配置文件
# 用于数据库迁移管理

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板文件，用于生成新的迁移脚本
# file_template = %%(rev)s_%%(slug)s

# sys.path 路径，用于导入应用模块
prepend_sys_path = .

# 时区设置（用于迁移文件时间戳）
# timezone =

# 迁移文件命名模板
# 使用序号前缀便于排序
file_template = %%(rev)s_%%(slug)s

# 截断 slug 长度
# truncate_slug_length = 40

# 设置为 'true' 时，revision 命令会在生成新迁移前检查当前 head 是否已应用
# revision_environment = false

# 设置为 'true' 时，env.py 会使用 2-phase commit
# sourceless = false

# 迁移版本文件后缀
# version_path_separator = os
# output_encoding = utf-8

# 数据库连接 URL（占位符，实际值由 env.py 从环境变量读取）
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# 迁移文件生成后的钩子
# 可用于自动格式化生成的迁移文件

# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# Logging 配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
