version: "3.8"

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16
    container_name: news-postgres
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - news-network

  # 测试数据库服务
  test_postgres:
    image: postgres:16
    container_name: news-test-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_news
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_news"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - news-network

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: news-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - news-network

  # FastAPI 应用服务
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: news-api
    environment:
      DATABASE_URL: postgresql://news:news@postgres:5432/news
      REDIS_URL: redis://redis:6379/0
      TEST_DATABASE_URL: postgresql://test:test@test_postgres:5432/test_news
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      test_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - news-network

volumes:
  postgres_data:

networks:
  news-network:
    driver: bridge
